name: PR

on:
  pull_request:
    branches: [develop, main]

# Un push nuevo al mismo PR cancela la ejecución anterior, que ya no sirve.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Un workflow reutilizable no puede tener más permisos que quien lo llama.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
